name: nightly-rescan

# The PR gate answers "did this change break quality?". It cannot answer "did
# quality drift while nobody changed anything?" -- and with an LLM behind the
# retriever, it does. The nightly re-runs the identical eval on an unchanged
# main and files an issue when the numbers move, which is how you catch a model
# rotation, a corpus edit, or judge drift without a PR to blame.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('ci/models.env') }}

      - run: ./ci/bootstrap.sh

      - name: rescan main
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_REPEATS: '5'   # more passes than the PR gate: this run is about
                              # measuring drift, so judge noise matters more
        run: |
          .venv/bin/python -m eval.run_eval --out artifacts/nightly.json --repeats 5

      - name: compare against the tracked baseline (never blocks)
        id: gate
        run: |
          .venv/bin/python -m eval.gate \
            --results artifacts/nightly.json \
            --baseline eval/baseline/main.json \
            --markdown artifacts/nightly.md \
            --json-out artifacts/nightly-verdict.json \
            --warn-only
          echo "decision=$(jq -r .decision artifacts/nightly-verdict.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-${{ github.run_id }}
          path: artifacts/
          retention-days: 90

      - name: open a drift issue
        if: steps.gate.outputs.decision == 'FAIL'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="RAG quality drift on main ($(date -u +%Y-%m-%d))"
          # One issue per day at most; reopen rather than pile up duplicates.
          existing=$(gh issue list --label rag-drift --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file artifacts/nightly.md
          else
            gh issue create --title "$title" --label rag-drift \
              --body-file artifacts/nightly.md
          fi
